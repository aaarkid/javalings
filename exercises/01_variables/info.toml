[[exercises]]
name = "variables1"
path = "Variables1.java"
hint = """
The declaration needs a type. `x` holds a whole number, so: `int x = 5;`
"""

[[exercises]]
name = "variables2"
path = "Variables2.java"
hint = """
`int x;` creates the variable but gives it nothing. Java refuses to read a
variable that might be empty. Write `int x = 10;` (or any other number).
"""

[[exercises]]
name = "variables3"
path = "Variables3.java"
hint = """
`number` is an int, so "three" (a String) cannot go into it.
Use the number 3 instead of the word.
"""

[[exercises]]
name = "variables4"
path = "Variables4.java"
hint = """
The compiler says "cannot assign a value to final variable start". The line
`start = current;` is the one to delete. Copying a constant into a normal
variable (`int current = start;`) is fine, changing the constant is not.
"""

[[exercises]]
name = "variables5"
path = "Variables5.java"
hint = """
Match each value to the table in the comment. "Ada" is a String, 13 is an int,
1.62 is a double, true is a boolean, 'A' is a char.

Check.equals is a tiny helper that stops the program if a value is wrong.
You will see it a lot in the coming exercises.
"""
