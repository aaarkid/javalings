[[exercises]]
name = "exceptions3"
path = "Exceptions3.java"
hint = """
class InsufficientFundsException extends Exception { ... }

    void withdraw(int amount) throws InsufficientFundsException {
        if (amount > balance) {
            throw new InsufficientFundsException("need " + (amount - balance) + " more");
        }
        balance -= amount;
    }

In main, wrap each withdraw call in try / catch (InsufficientFundsException e)
and set `message = e.getMessage();` in the catch of the second one.
The first call can also just live inside a try with an empty-ish catch, or
main itself can declare `throws InsufficientFundsException`.
"""
