[[exercises]]
name = "enums1"
path = "Enums1.java"
hint = """
    enum Season { SPRING, SUMMER, AUTUMN, WINTER }

next with a switch expression:
    return switch (s) {
        case SPRING -> Season.SUMMER;
        ...
    };

Or with arithmetic: Season.values()[(s.ordinal() + 1) % 4].
"""

