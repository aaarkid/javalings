[[exercises]]
name = "lambdas2"
path = "Lambdas2.java"
hint = """
    static <T, R> List<R> applyToAll(List<T> list, Function<T, R> f) {
        List<R> result = new ArrayList<>();
        for (T item : list) {
            result.add(f.apply(item));
        }
        return result;
    }

    List<Integer> doubled = applyToAll(nums, n -> n * 2);
    List<Integer> lengths = applyToAll(words, w -> w.length());
"""

